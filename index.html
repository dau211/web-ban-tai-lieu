<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Tài Liệu</title>
    <!-- Nhúng thư viện Tailwind CSS để web tự động đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS bổ sung để chặn in ấn (ẩn toàn bộ trang khi ấn Ctrl+P) */
        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Khung sản phẩm -->
    <div class="bg-white rounded-2xl shadow-lg max-w-md w-full overflow-hidden">
        <div class="p-6">
            <h2 class="text-xs font-bold text-blue-500 mb-1">TRƯỜNG THPT ĐÀO DUY TỪ</h2>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Bộ Đề Thi Thử Môn Vật lí</h1>
            <p class="text-gray-600 mb-4">Tài liệu ôn tập tổng hợp chuyên sâu. Mua một lần, nhận ngay file Word qua Email.</p>
            
            <div class="flex justify-between items-center mb-6">
                <span class="text-3xl font-extrabold text-red-500">50.000đ</span>
            </div>

            <!-- Các nút bấm -->
            <div class="space-y-3">
                <button class="w-full bg-blue-100 text-blue-700 font-semibold py-3 rounded-lg hover:bg-blue-200 transition">
                    👀 Xem Trước PDF (Đọc thử)
                </button>
                <button class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition shadow-md">
                    🛒 Mua Ngay & Nhận File Word
                </button>
            </div>
        </div>
    </div>

    <!-- Script bảo vệ bản quyền: chặn chuột phải, F12 và Ctrl+P -->
    <script>
        // Chặn click chuột phải
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Chặn F12 và Ctrl+P
        document.addEventListener('keydown', function(e) {
            // Chặn F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // Chặn Ctrl+P (In ấn)
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
            }
            // Chặn Ctrl+Shift+I (Mở công cụ lập trình của trình duyệt)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>

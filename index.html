<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài liệu Vật lí</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 relative">

    <div id="danh-sach-san-pham" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
        <p class="text-center w-full col-span-full text-gray-600">⏳ Đang tải dữ liệu từ kho Google Sheets...</p>
    </div>

    <!-- Khung Popup ẩn để hỏi thông tin khách hàng -->
    <div id="popup-mua-hang" class="fixed inset-0 bg-black bg-opacity-50 hidden flex-col items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Thông tin nhận tài liệu</h3>
            <p class="text-sm text-gray-500 mb-4">Vui lòng nhập chính xác Email để hệ thống gửi file Word sau khi thanh toán.</p>
            
            <input id="ten-khach" type="text" placeholder="Họ và tên của bạn" class="w-full border border-gray-300 p-3 mb-3 rounded-lg outline-none focus:border-blue-500">
            <input id="email-khach" type="email" placeholder="Email nhận file" class="w-full border border-gray-300 p-3 mb-4 rounded-lg outline-none focus:border-blue-500">
            
            <button onclick="xacNhanMua()" id="nut-xac-nhan" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition mb-2">
                Tạo Mã QR Chuyển Khoản
            </button>
            <button onclick="dongPopup()" class="w-full bg-gray-200 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-300 transition">
                Hủy bỏ
            </button>
        </div>
    </div>

    <script>
        // 1. DÁN LINK GOOGLE SHEETS CỦA BẠN VÀO GIỮA 2 DẤU NGOẶC KÉP BÊN DƯỚI:
        const LINK_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbxdLiMh4FAHMeurvp9yuJTkzvfTD6AVNHv_QBB4NKKSrdgsAOzE-Fb-xwauChx24NxKDg/exec";

        let spDangChon = null;

        async function taiDuLieu() {
            try {
                const response = await fetch(LINK_GOOGLE_SHEETS);
                const data = await response.json();
                
                const khungChua = document.getElementById('danh-sach-san-pham');
                khungChua.innerHTML = ''; 
                
                data.forEach(sanPham => {
                    const theSanPham = `
                    <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col h-full">
                        <div class="p-6 flex flex-col flex-grow">
                            <h2 class="text-xs font-bold text-blue-500 mb-1">TRƯỜNG THPT ĐÀO DUY TỪ</h2>
                            <h1 class="text-xl font-bold text-gray-800 mb-2">${sanPham.tenSanPham}</h1>
                            <p class="text-gray-600 mb-4 text-sm flex-grow">Mã SP: ${sanPham.maSanPham}</p>
                            
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-3xl font-extrabold text-red-500">${sanPham.giaTien}đ</span>
                            </div>
                            <div class="space-y-3 mt-auto">
                                <a href="${sanPham.linkPDF}" target="_blank" class="block w-full text-center bg-blue-100 text-blue-700 font-semibold py-3 rounded-lg hover:bg-blue-200 transition">
                                    👀 Xem Trước PDF
                                </a>
                                <!-- Nút Mua Ngay đã được kích hoạt chức năng mở Popup -->
                                <button onclick="moPopup('${sanPham.maSanPham}', '${sanPham.tenSanPham}', ${sanPham.giaTien})" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition shadow-md">
                                    🛒 Mua Ngay
                                </button>
                            </div>
                        </div>
                    </div>
                    `;
                    khungChua.innerHTML += theSanPham;
                });
            } catch (error) {
                document.getElementById('danh-sach-san-pham').innerHTML = '<p class="text-center w-full text-red-500">❌ Có lỗi xảy ra khi tải dữ liệu.</p>';
            }
        }

        taiDuLieu();

        function moPopup(ma, ten, gia) {
            spDangChon = { maSanPham: ma, tenSanPham: ten, giaTien: gia };
            document.getElementById('popup-mua-hang').classList.remove('hidden');
            document.getElementById('popup-mua-hang').classList.add('flex');
        }

        function dongPopup() {
            document.getElementById('popup-mua-hang').classList.add('hidden');
            document.getElementById('popup-mua-hang').classList.remove('flex');
            spDangChon = null;
        }

        async function xacNhanMua() {
            const tenKhach = document.getElementById('ten-khach').value;
            const emailKhach = document.getElementById('email-khach').value;
            
            if(!tenKhach || !emailKhach) {
                alert("Vui lòng nhập đủ Tên và Email!");
                return;
            }

            const nutXacNhan = document.getElementById('nut-xac-nhan');
            nutXacNhan.innerText = "⏳ Đang tạo mã QR...";
            nutXacNhan.disabled = true;

            try {
                const response = await fetch('/api/tao-don-hang', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenKhach: tenKhach,
                        email: emailKhach,
                        maSanPham: spDangChon.maSanPham,
                        tenSanPham: spDangChon.tenSanPham,
                        giaTien: spDangChon.giaTien
                    })
                });
                
                const data = await response.json();
                
                if(data.thanhCong) {
                    window.location.href = data.linkQR;
                } else {
                    alert("Lỗi: Không thể kết nối. Bạn nhớ hoàn thành Bước 2 (PayOS) chưa?");
                    nutXacNhan.innerText = "Tạo Mã QR Chuyển Khoản";
                    nutXacNhan.disabled = false;
                }
            } catch (error) {
                alert("Hệ thống chưa tạo được QR do thiếu 3 mã PayOS.");
                nutXacNhan.innerText = "Tạo Mã QR Chuyển Khoản";
                nutXacNhan.disabled = false;
            }
        }

        // Chống copy, F12
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault();
        });
    </script>
</body>
</html>

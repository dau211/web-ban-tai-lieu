<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Tài Liệu - THPT Đào Duy Từ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print { body { display: none !important; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

    <!-- Banner (Phần đầu trang) -->
<header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-8">

        <!-- Tiêu đề chính -->
        <h1 class="text-4xl md:text-5xl font-extrabold uppercase tracking-wide">
            THƯ VIỆN HỌC LIỆU
        </h1>

        <!-- Dòng mô tả -->
        <p class="mt-2 text-lg md:text-xl text-blue-100">
            Chọn lọc • Chất lượng • Cập nhật liên tục
        </p>

    </div>
</header>

    <div class="flex-grow max-w-7xl mx-auto w-full flex flex-col md:flex-row p-4 gap-6">
        <aside class="w-full md:w-1/4 bg-white rounded-xl shadow-sm p-4 border border-gray-100 self-start">
            <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
                <span class="mr-2">📁</span> Danh Mục Tài Liệu
            </h2>
            <div id="danh-sach-thu-muc" class="space-y-2 text-gray-700">
                <p class="text-sm text-gray-500">Đang tải danh mục...</p>
            </div>
        </aside>

        <main class="w-full md:w-3/4">
            <div class="flex justify-between items-center mb-4">
                <h2 id="tieu-de-hien-tai" class="text-xl font-bold text-gray-800">Tất cả tài liệu</h2>
                <span id="so-luong-hien-tai" class="bg-blue-100 text-blue-700 text-sm font-semibold px-3 py-1 rounded-full">0</span>
            </div>
            
            <div id="danh-sach-san-pham" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-5">
                <p class="text-center w-full col-span-full text-gray-500 py-10">⏳ Đang tải dữ liệu từ kho Google Sheets...</p>
            </div>
        </main>
    </div>

    <!-- Popup Mua Hàng -->
    <div id="popup-mua-hang" class="fixed inset-0 bg-black bg-opacity-60 hidden flex-col items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl w-full max-w-sm shadow-2xl relative">
            <h3 class="text-xl font-bold text-gray-800 mb-2">Thông tin nhận tài liệu</h3>
            <p class="text-sm text-gray-500 mb-4">Vui lòng nhập chính xác Email để hệ thống gửi file Word sau khi thanh toán.</p>
            
            <input id="ten-khach" type="text" placeholder="Họ và tên của bạn" class="w-full border border-gray-300 p-3 mb-3 rounded-lg outline-none focus:border-blue-500">
            <input id="email-khach" type="email" placeholder="Email nhận file" class="w-full border border-gray-300 p-3 mb-4 rounded-lg outline-none focus:border-blue-500">
            
            <button onclick="xacNhanMua()" id="nut-xac-nhan" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition mb-2">
                Tạo Mã QR Chuyển Khoản
            </button>
            <button onclick="dongPopup()" class="w-full bg-gray-100 text-gray-700 font-semibold py-3 rounded-lg hover:bg-gray-200 transition">
                Hủy bỏ
            </button>
        </div>
    </div>

    <script>
        // 1. DÁN LINK GOOGLE SHEETS CỦA BẠN VÀO GIỮA 2 DẤU NGOẶC KÉP DƯỚI ĐÂY:
        const LINK_GOOGLE_SHEETS = "https://script.google.com/macros/s/AKfycbxdLiMh4FAHMeurvp9yuJTkzvfTD6AVNHv_QBB4NKKSrdgsAOzE-Fb-xwauChx24NxKDg/exec";

        let duLieuGoc = [];
        let spDangChon = null;

        async function taiDuLieu() {
            try {
                const response = await fetch(LINK_GOOGLE_SHEETS);
                duLieuGoc = await response.json();
                taoCayThuMuc(duLieuGoc);
                hienThiSanPham(duLieuGoc, "Tất cả tài liệu");
            } catch (error) {
                document.getElementById('danh-sach-san-pham').innerHTML = '<p class="text-center w-full text-red-500 py-10">❌ Có lỗi xảy ra khi tải dữ liệu.</p>';
            }
        }

        function taoCayThuMuc(data) {
            const thuMucMap = {};
            data.forEach(sp => {
                const tm = sp.thuMuc;
                const tmc = sp.thuMucCon;
                if(!thuMucMap[tm]) thuMucMap[tm] = new Set();
                thuMucMap[tm].add(tmc);
            });

            const khungThuMuc = document.getElementById('danh-sach-thu-muc');
            khungThuMuc.innerHTML = `<div onclick="hienThiSanPham(duLieuGoc, 'Tất cả tài liệu')" class="cursor-pointer font-bold text-blue-600 hover:text-blue-800 py-1 transition">🌍 Tất cả tài liệu</div>`;

            for (const tm in thuMucMap) {
                let htmlThuMucCon = '';
                thuMucMap[tm].forEach(tmc => {
                    htmlThuMucCon += `<div onclick="locSanPham('${tm}', '${tmc}')" class="cursor-pointer pl-6 py-1 text-sm text-gray-600 hover:text-blue-500 border-l-2 border-transparent hover:border-blue-400 transition">↳ ${tmc}</div>`;
                });
                khungThuMuc.innerHTML += `<div class="mt-3"><div onclick="locSanPham('${tm}', null)" class="cursor-pointer font-semibold text-gray-800 hover:text-blue-600 py-1 flex items-center transition">📂 ${tm}</div><div class="flex flex-col">${htmlThuMucCon}</div></div>`;
            }
        }

        function locSanPham(tm, tmc) {
            let sanPhamLoc = tmc ? duLieuGoc.filter(sp => sp.thuMuc === tm && sp.thuMucCon === tmc) : duLieuGoc.filter(sp => sp.thuMuc === tm);
            hienThiSanPham(sanPhamLoc, tmc ? `${tm} / ${tmc}` : tm);
        }

        function hienThiSanPham(danhSach, tieuDe) {
            document.getElementById('tieu-de-hien-tai').innerText = tieuDe;
            document.getElementById('so-luong-hien-tai').innerText = danhSach.length;
            const khungChua = document.getElementById('danh-sach-san-pham');
            khungChua.innerHTML = ''; 

            if(danhSach.length === 0) {
                khungChua.innerHTML = '<p class="text-center w-full col-span-full text-gray-500 py-10">Chưa có tài liệu nào trong thư mục này.</p>';
                return;
            }
            
            danhSach.forEach(sanPham => {
                let hienThiGia = '';
                let nutHanhDong = '';

                // KIỂM TRA: Nếu giá = 0 thì làm nút Miễn phí
                if(sanPham.giaTien == 0 || sanPham.giaTien === "") {
                    hienThiGia = `<span class="text-2xl font-extrabold text-green-500 tracking-tight">Miễn phí</span>`;
                    nutHanhDong = `
                        <a href="${sanPham.linkTaiMienPhi}" target="_blank" class="w-full block text-center bg-green-500 text-white font-bold py-2.5 rounded-lg hover:bg-green-600 transition shadow text-sm">
                            📥 Tải miễn phí
                        </a>
                    `;
                } else {
                    // Ngược lại thì làm nút Mua hàng
                    hienThiGia = `<span class="text-2xl font-extrabold text-red-500 tracking-tight">${Number(sanPham.giaTien).toLocaleString('vi-VN')}đ</span>`;
                    nutHanhDong = `
                        <button onclick="moPopup('${sanPham.maSanPham}', '${sanPham.tenSanPham}', ${sanPham.giaTien})" class="w-full bg-green-500 text-white font-bold py-2.5 rounded-lg hover:bg-green-600 transition shadow text-sm">
                            🛒 Tải file Word
                        </button>
                    `;
                }

                khungChua.innerHTML += `
                <div class="bg-white border border-gray-100 rounded-xl shadow-sm hover:shadow-lg transition overflow-hidden flex flex-col h-full">
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">${sanPham.thuMuc} ${sanPham.thuMucCon != 'Chung' ? '• ' + sanPham.thuMucCon : ''}</h3>
                        <h1 class="text-lg font-bold text-gray-800 mb-2 leading-snug">${sanPham.tenSanPham}</h1>
                        <p class="text-gray-500 mb-4 text-xs flex-grow">Mã SP: <span class="font-mono bg-gray-100 px-1 rounded">${sanPham.maSanPham}</span></p>
                        
                        <div class="flex items-end justify-between mb-4 mt-auto">
                            ${hienThiGia}
                        </div>
                        <div class="space-y-2">
                            <a href="${sanPham.linkPDF}" target="_blank" class="block w-full text-center bg-blue-50 text-blue-600 font-semibold py-2.5 rounded-lg hover:bg-blue-100 transition text-sm">
                                👀 XEM TRƯỚC
                            </a>
                            ${nutHanhDong}
                        </div>
                    </div>
                </div>
                `;
            });
        }

        taiDuLieu();

        function moPopup(ma, ten, gia) {
            spDangChon = { maSanPham: ma, tenSanPham: ten, giaTien: gia };
            document.getElementById('popup-mua-hang').classList.remove('hidden');
            document.getElementById('popup-mua-hang').classList.add('flex');
        }
        function dongPopup() {
            document.getElementById('popup-mua-hang').classList.add('hidden');
            document.getElementById('popup-mua-hang').classList.remove('flex');
            spDangChon = null;
        }
        async function xacNhanMua() {
            const tenKhach = document.getElementById('ten-khach').value;
            const emailKhach = document.getElementById('email-khach').value;
            if(!tenKhach || !emailKhach) { alert("Vui lòng nhập đủ Tên và Email!"); return; }
            
            const nutXacNhan = document.getElementById('nut-xac-nhan');
            nutXacNhan.innerText = "⏳ Đang xử lý...";
            nutXacNhan.disabled = true;

            try {
                const response = await fetch('/api/tao-don-hang', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenKhach, email: emailKhach, maSanPham: spDangChon.maSanPham, tenSanPham: spDangChon.tenSanPham, giaTien: spDangChon.giaTien })
                });
                const data = await response.json();
                if(data.thanhCong) window.location.href = data.linkQR;
                else throw new Error("Lỗi");
            } catch (error) {
                alert("Hệ thống chưa tạo được QR do thiếu 3 mã PayOS.");
                nutXacNhan.innerText = "Tạo Mã QR Chuyển Khoản";
                nutXacNhan.disabled = false;
            }
        }
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => { if (e.key === 'F12' || (e.ctrlKey && e.key === 'p') || (e.ctrlKey && e.shiftKey && e.key === 'I')) e.preventDefault(); });
    </script>
</body>
</html>
